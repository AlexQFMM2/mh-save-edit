name: MH Save Editor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  RUNTIME_ASSETS_SHA256: cb7baa9d3b7a57cdbc6e5c744513a3c6b92d1db3b9aea5b48f86b1a68e980642

jobs:
  check:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download encrypted runtime test assets
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ASSETS_PASSWORD: ${{ secrets.RUNTIME_ASSETS_V2_PASSWORD }}
        run: |
          test -n "$RUNTIME_ASSETS_PASSWORD"
          mkdir -p .runtime-assets
          gh release download runtime-assets-v2 \
            --pattern mh-save-edit-runtime-assets-v2.zip \
            --dir .runtime-assets
          echo "$RUNTIME_ASSETS_SHA256  .runtime-assets/mh-save-edit-runtime-assets-v2.zip" | sha256sum --check
          unzip -P "$RUNTIME_ASSETS_PASSWORD" -o \
            .runtime-assets/mh-save-edit-runtime-assets-v2.zip
          node tools/repair_runtime_catalog.mjs
          for database in mh3g.sqlite mh4g.sqlite mhgu.sqlite; do
            test "$(head -c 15 "data/$database")" = "SQLite format 3"
          done
          test "$(find ui/public/assets/catalog/icons -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 1941
      - run: pnpm data:audit:runtime
      - run: pnpm typecheck
      - name: Test without private manifest snapshots
        run: pnpm exec vitest run --exclude tests/weaponCatalogData.test.ts --minWorkers=1 --maxWorkers=2
      - run: pnpm build
      - name: Verify compiled GU runtime search
        env:
          GU_BUILT_WORKER: out/main/auto-search-worker.js
        run: pnpm exec vitest run tests/guBuiltWorker.test.ts --minWorkers=1 --maxWorkers=2

  package-windows:
    # Immutable tagged previews publish directly to the existing private Release.
    # Main pushes validate source only; avoid duplicate Windows builds/artifacts.
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == true
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard clean checkout boundary
        shell: pwsh
        run: |
          $privateFiles = @(
            Get-ChildItem data -Filter *.sqlite -File -ErrorAction SilentlyContinue
            Get-ChildItem ui/public/assets/catalog/icons -File -ErrorAction SilentlyContinue
            Get-ChildItem build -Filter app-icon.* -File -ErrorAction SilentlyContinue
          )
          if ($privateFiles.Count -gt 0) {
            $privateFiles | ForEach-Object { Write-Error "Private runtime asset found: $($_.FullName)" }
            exit 1
          }
      - name: Download encrypted runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ASSETS_PASSWORD: ${{ secrets.RUNTIME_ASSETS_V2_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNTIME_ASSETS_PASSWORD)) {
            throw 'RUNTIME_ASSETS_PASSWORD is not configured'
          }
          New-Item -ItemType Directory -Path .runtime-assets -Force | Out-Null
          gh release download runtime-assets-v2 `
            --pattern mh-save-edit-runtime-assets-v2.zip `
            --dir .runtime-assets
          $archiveHash = (Get-FileHash .runtime-assets/mh-save-edit-runtime-assets-v2.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:RUNTIME_ASSETS_SHA256) { throw 'Runtime archive identity mismatch' }
          & 7z x .runtime-assets/mh-save-edit-runtime-assets-v2.zip `
            "-p$env:RUNTIME_ASSETS_PASSWORD" `
            "-o$PWD" `
            -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply runtime catalog migrations
        shell: pwsh
        run: node tools/repair_runtime_catalog.mjs
      - run: pnpm data:audit:runtime
      - name: Validate injected runtime assets
        shell: pwsh
        run: |
          $expectedDatabases = @('mh3g.sqlite', 'mh4g.sqlite', 'mhgu.sqlite')
          foreach ($database in $expectedDatabases) {
            $path = Join-Path data $database
            if (!(Test-Path $path -PathType Leaf)) { throw "Missing runtime database: $path" }
            $header = [System.IO.File]::ReadAllBytes($path)[0..15]
            $signature = [System.Text.Encoding]::ASCII.GetString($header)
            if (!$signature.StartsWith('SQLite format 3')) { throw "Invalid SQLite database: $path" }
          }
          $unexpectedDatabases = Get-ChildItem data -Filter *.sqlite -File | Where-Object Name -NotIn $expectedDatabases
          if ($unexpectedDatabases.Count -gt 0) { throw 'Unexpected runtime database found' }
          $icons = @(Get-ChildItem ui/public/assets/catalog/icons -Filter *.png -File)
          if ($icons.Count -ne 1941) { throw "Expected 1941 catalog icons, found $($icons.Count)" }
          if (!(Test-Path build/app-icon.ico -PathType Leaf)) { throw 'Missing Windows application icon' }
          if (!(Test-Path build/app-icon.png -PathType Leaf)) { throw 'Missing application icon preview' }
      - run: pnpm package:win
      - name: Verify packaged Electron native-addon ABI
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'mh-save-editor-native-smoke.cjs'
          @'
          const path = require('node:path');
          if (!process.versions.electron) throw new Error('Expected packaged Electron, not host Node');
          const addon = path.join(path.dirname(process.execPath), 'resources', 'app.asar.unpacked', 'node_modules', 'better-sqlite3', 'build', 'Release', 'better_sqlite3.node');
          const loaded = require(addon);
          if (typeof loaded.Database !== 'function') throw new Error('SQLite native constructor missing');
          console.log(JSON.stringify({ electron: process.versions.electron, abi: process.versions.modules, sqliteAddonLoaded: true }));
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          $env:ELECTRON_RUN_AS_NODE = '1'
          & './release/win-unpacked/MH Save Editor.exe' $script | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Validate embedded Windows icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $sourcePath = (Resolve-Path build/app-icon.ico).Path
          $targets = @(
            @{ Name = 'unpacked'; Path = (Resolve-Path 'release/win-unpacked/MH Save Editor.exe').Path }
          )
          foreach ($target in $targets) {
            if ([string]::IsNullOrWhiteSpace($target.Path)) { throw "Missing $($target.Name) executable" }
            $expectedIcon = [System.Drawing.Icon]::new($sourcePath, 32, 32)
            $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($target.Path)
            if ($null -eq $actualIcon) { throw "Unable to extract $($target.Name) icon" }
            $expected = $expectedIcon.ToBitmap()
            $actual = $actualIcon.ToBitmap()
            if ($expected.Width -ne $actual.Width -or $expected.Height -ne $actual.Height) {
              throw "$($target.Name) icon dimensions do not match"
            }
            for ($y = 0; $y -lt $expected.Height; $y++) {
              for ($x = 0; $x -lt $expected.Width; $x++) {
                if ($expected.GetPixel($x, $y).ToArgb() -ne $actual.GetPixel($x, $y).ToArgb()) {
                  throw "$($target.Name) executable does not contain the Tigrex icon"
                }
              }
            }
            $actual.Save("release/win-unpacked/app-icon-$($target.Name).png", [System.Drawing.Imaging.ImageFormat]::Png)
            $expected.Dispose()
            $actual.Dispose()
            $expectedIcon.Dispose()
            $actualIcon.Dispose()
          }
      - name: Write SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release/win-unpacked -Filter *.exe -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/win-unpacked/SHA256SUMS.txt
      - name: Archive and publish verified private preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visibility = gh repo view $env:GITHUB_REPOSITORY --json visibility --jq '.visibility'
          if ($LASTEXITCODE -ne 0 -or $visibility.Trim() -ne 'PRIVATE') { throw 'Preview distribution requires a private repository' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          $archiveName = "mh-save-editor-$($env:GITHUB_REF_NAME)-windows-x64.tar.gz"
          $archive = Join-Path $PWD "release/$archiveName"
          tar -C release/win-unpacked -czf $archive .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content release/SHA256SUMS.txt -Encoding utf8
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag --draft `
            --title $env:GITHUB_REF_NAME --generate-notes `
            $archive release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
