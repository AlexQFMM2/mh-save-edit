name: MH Save Editor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download encrypted runtime test assets
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ASSETS_PASSWORD: ${{ secrets.RUNTIME_ASSETS_PASSWORD }}
        run: |
          test -n "$RUNTIME_ASSETS_PASSWORD"
          mkdir -p .runtime-assets
          gh release download runtime-assets-v1 \
            --pattern mh-save-edit-runtime-assets-v1.zip \
            --dir .runtime-assets
          unzip -P "$RUNTIME_ASSETS_PASSWORD" -o \
            .runtime-assets/mh-save-edit-runtime-assets-v1.zip
          node tools/repair_runtime_catalog.mjs
          for database in mh3g.sqlite mh4g.sqlite mhgu.sqlite; do
            test "$(head -c 15 "data/$database")" = "SQLite format 3"
          done
          test "$(find ui/public/assets/catalog/icons -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 1941
      - run: pnpm typecheck
      - name: Test without private manifest snapshots
        run: pnpm exec vitest run --exclude tests/weaponCatalogData.test.ts --minWorkers=1 --maxWorkers=2
      - run: pnpm build

  package-windows:
    if: github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard clean checkout boundary
        shell: pwsh
        run: |
          $privateFiles = @(
            Get-ChildItem data -Filter *.sqlite -File -ErrorAction SilentlyContinue
            Get-ChildItem ui/public/assets/catalog/icons -File -ErrorAction SilentlyContinue
            Get-ChildItem build -Filter app-icon.* -File -ErrorAction SilentlyContinue
          )
          if ($privateFiles.Count -gt 0) {
            $privateFiles | ForEach-Object { Write-Error "Private runtime asset found: $($_.FullName)" }
            exit 1
          }
      - name: Download encrypted runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ASSETS_PASSWORD: ${{ secrets.RUNTIME_ASSETS_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNTIME_ASSETS_PASSWORD)) {
            throw 'RUNTIME_ASSETS_PASSWORD is not configured'
          }
          New-Item -ItemType Directory -Path .runtime-assets -Force | Out-Null
          gh release download runtime-assets-v1 `
            --pattern mh-save-edit-runtime-assets-v1.zip `
            --dir .runtime-assets
          & 7z x .runtime-assets/mh-save-edit-runtime-assets-v1.zip `
            "-p$env:RUNTIME_ASSETS_PASSWORD" `
            "-o$PWD" `
            -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply runtime catalog migrations
        shell: pwsh
        run: node tools/repair_runtime_catalog.mjs
      - name: Validate injected runtime assets
        shell: pwsh
        run: |
          $expectedDatabases = @('mh3g.sqlite', 'mh4g.sqlite', 'mhgu.sqlite')
          foreach ($database in $expectedDatabases) {
            $path = Join-Path data $database
            if (!(Test-Path $path -PathType Leaf)) { throw "Missing runtime database: $path" }
            $header = [System.IO.File]::ReadAllBytes($path)[0..15]
            $signature = [System.Text.Encoding]::ASCII.GetString($header)
            if (!$signature.StartsWith('SQLite format 3')) { throw "Invalid SQLite database: $path" }
          }
          $unexpectedDatabases = Get-ChildItem data -Filter *.sqlite -File | Where-Object Name -NotIn $expectedDatabases
          if ($unexpectedDatabases.Count -gt 0) { throw 'Unexpected runtime database found' }
          $icons = @(Get-ChildItem ui/public/assets/catalog/icons -Filter *.png -File)
          if ($icons.Count -ne 1941) { throw "Expected 1941 catalog icons, found $($icons.Count)" }
          if (!(Test-Path build/app-icon.ico -PathType Leaf)) { throw 'Missing Windows application icon' }
          if (!(Test-Path build/app-icon.png -PathType Leaf)) { throw 'Missing application icon preview' }
      - run: pnpm exec electron-builder install-app-deps
      - run: pnpm package:win
      - name: Validate embedded Windows icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $sourcePath = (Resolve-Path build/app-icon.ico).Path
          $targets = @(
            @{ Name = 'unpacked'; Path = (Resolve-Path 'release/win-unpacked/MH Save Editor.exe').Path }
          )
          foreach ($target in $targets) {
            if ([string]::IsNullOrWhiteSpace($target.Path)) { throw "Missing $($target.Name) executable" }
            $expectedIcon = [System.Drawing.Icon]::new($sourcePath, 32, 32)
            $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($target.Path)
            if ($null -eq $actualIcon) { throw "Unable to extract $($target.Name) icon" }
            $expected = $expectedIcon.ToBitmap()
            $actual = $actualIcon.ToBitmap()
            if ($expected.Width -ne $actual.Width -or $expected.Height -ne $actual.Height) {
              throw "$($target.Name) icon dimensions do not match"
            }
            for ($y = 0; $y -lt $expected.Height; $y++) {
              for ($x = 0; $x -lt $expected.Width; $x++) {
                if ($expected.GetPixel($x, $y).ToArgb() -ne $actual.GetPixel($x, $y).ToArgb()) {
                  throw "$($target.Name) executable does not contain the Tigrex icon"
                }
              }
            }
            $actual.Save("release/win-unpacked/app-icon-$($target.Name).png", [System.Drawing.Imaging.ImageFormat]::Png)
            $expected.Dispose()
            $actual.Dispose()
            $expectedIcon.Dispose()
            $actualIcon.Dispose()
          }
      - name: Write SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release/win-unpacked -Filter *.exe -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/win-unpacked/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mh-save-editor-windows-x64
          path: release/win-unpacked/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mh-save-editor-windows-x64
          path: release/win-unpacked
      - name: Archive Windows portable build
        run: |
          tar -C release/win-unpacked -czf "mh-save-editor-${GITHUB_REF_NAME}-windows-x64.tar.gz" .
          sha256sum "mh-save-editor-${GITHUB_REF_NAME}-windows-x64.tar.gz" > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "mh-save-editor-${GITHUB_REF_NAME}-windows-x64.tar.gz" \
            SHA256SUMS.txt
